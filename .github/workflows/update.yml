name: Monthly data update

on:
  schedule:
    - cron: "0 9 * * *"   # daily at 09:00 UTC; fresh downloads start each new month
    - cron: "0 10 5 * *"  # monthly audit on the 5th
  workflow_dispatch: {}    # "Run workflow" button for manual rebuilds
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**", "data/manual/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

env:
  SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
  NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
  LEGISTAR_TOKEN: ${{ secrets.LEGISTAR_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  # City and State download in parallel, each with its own time limit.
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        jurisdiction: [city, state]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore saved downloads
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ matrix.jurisdiction }}-${{ github.run_id }}
          restore-keys: raw-${{ matrix.jurisdiction }}-
      - name: Build ${{ matrix.jurisdiction }} data
        env:
          PIPELINE_TIME_BUDGET_MIN: "300"   # stop downloading after 5 hours; the next run resumes
        run: python -u -m pipeline.run --only ${{ matrix.jurisdiction }} --out site/data
      - name: Save downloads for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ matrix.jurisdiction }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.jurisdiction }}
          path: |
            site/data/${{ matrix.jurisdiction }}.json
            site/data/manifest-${{ matrix.jurisdiction }}.json
            data/review/${{ matrix.jurisdiction }}_entity_review.csv
            data/cache/bill_titles_${{ matrix.jurisdiction }}.json
          if-no-files-found: warn

  # Diagnostic only: never blocks publishing.
  audit:
    needs: test
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 10 5 * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -u -m pipeline.audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit
          path: data/review/audit_report.md
          if-no-files-found: ignore

  publish:
    needs: [build, audit]
    # Publish whatever finished; a tab still downloading shows an "on its way" note.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: audit
          path: data/review
      - name: Commit review files and bill-title cache
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          mkdir -p data/review data/cache
          git add data/review data/cache
          git diff --cached --quiet || git commit -m "Monthly audit, entity review queue and bill titles"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
