# Earliest year loaded. State lobbying data on Open NY starts in 2019.
start_year: 2019

# Officials' donor lists show donors whose total giving in the selected years
# is at least this amount. Applied in the browser so it respects the time filter.
donor_threshold: 2500

# Shown in the site header.
refresh_label: Updated monthly from public filings

# Fuzzy name matching (0-100, rapidfuzz token_sort_ratio).
# >= auto_merge: names treated as the same entity.
# between review and auto_merge: written to data/review/entity_review.csv for a person to confirm.
entity_match:
  auto_merge: 95
  review: 88

# Rows per API page.
page_size: 25000
