name: Monthly data update

on:
  schedule:
    - cron: "0 9 5 * *"   # 09:00 UTC on the 5th of each month
  workflow_dispatch: {}    # "Run workflow" button for manual rebuilds
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**", "data/manual/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
      LEGISTAR_TOKEN: ${{ secrets.LEGISTAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Audit sources
        run: python -m pipeline.audit
      - name: Build data
        run: python -m pipeline.run --out site/data
      - name: Commit review files and bill-title cache
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/review data/cache
          git diff --cached --quiet || git commit -m "Monthly audit, entity review queue and bill titles"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
